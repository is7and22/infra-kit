name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: check_trace.py
        run: python3 -m unittest discover -s otel/check/tests -v
      - name: Collector 設定靜態檢查
        run: python3 -m unittest discover -s otel/collector/tests -v

  ansible-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 與跳板同版；ansible-core 2.22 要 Python 3.13 以上
      - run: pip install ansible-core==2.22.0 jsonschema==4.26.0
      - name: 轉接器、callback、filter
        run: python3 -m unittest discover -s ansible-facts/tests -t ansible-facts/tests -v

  collector-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: otelcol-contrib validate
        run: |
          docker run --rm \
            -e OPENOBSERVE_OTLP_ENDPOINT=https://o2.example.org/api/demo \
            -e "OPENOBSERVE_AUTH=Basic ZmFrZTpmYWtl" \
            -v "$PWD/otel/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.165.0 \
            validate --config=/etc/otelcol-contrib/config.yaml

  nginx-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: nginx 片段：nginx -t、重複 include、傳播
        run: ./otel/nginx/test/run.sh

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files
