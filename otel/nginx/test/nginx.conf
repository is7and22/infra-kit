# CI 用：模擬一台多個項目共用的 nginx，驗官方 otel 映像裡 nginx -t 通過
#   8080、8081：兩個項目，各自 include server.conf
#   8082：沒接的項目，不 include server.conf，不起 span
#   9000：假上游，回傳收到的 traceparent（run.sh 的傳播實測用）
load_module modules/ngx_otel_module.so;

events {}

http {
    include /etc/nginx/otel/http.conf;
    otel_service_name ci-nginx;

    server {
        listen 8080;
        include /etc/nginx/otel/server.conf;
        otel_span_attr project example-a;
        location / {
            proxy_pass http://127.0.0.1:9000;
        }
    }

    server {
        listen 8081;
        include /etc/nginx/otel/server.conf;
        otel_span_attr project example-b;
        location / {
            proxy_pass http://127.0.0.1:9000;
        }
    }

    server {
        listen 8082;
        location / {
            proxy_pass http://127.0.0.1:9000;
        }
    }

    server {
        listen 9000;
        location / {
            default_type text/plain;
            return 200 "$http_traceparent\n";
        }
    }
}
