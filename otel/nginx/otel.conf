# http 層片段：在 nginx.conf 的 http { } 裡 include。
# 前提：nginx.conf 頂端（main 層）已有 load_module modules/ngx_otel_module.so;
# 這行放不進本片段：load_module 只能在 main 層，寫在 http 層 nginx -t 會失敗。
# 服務名由項目在 include 之後自己寫：otel_service_name <項目>-nginx;

otel_exporter {
    endpoint otel-collector:4317;
}

otel_trace on;
# 已帶 traceparent 的請求沿用它的 trace，沒有就新起；轉給上游時帶上更新後的 traceparent
otel_trace_context propagate;
