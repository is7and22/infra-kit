# http 層片段：每台 nginx 只 include 一次，放在 nginx.conf 的 http { } 裡。
# 由這台 nginx 的擁有者 include；項目不要在自己的設定檔裡 include 它，
# 第二次 include 時 nginx -t 會失敗（"otel_exporter" directive is duplicate）。
#
# 前提：nginx.conf 頂端（main 層）已有 load_module modules/ngx_otel_module.so;
# 這行放不進本片段：load_module 只能在 main 層。
#
# include 之後由擁有者寫服務名（只能在 http 層，一台 nginx 只有一個）：
#   otel_service_name <名稱>;
#
# Collector 位址是範例值，對應 collector/compose.example.yaml 的服務名。
# 位址不同時不要 include 本片段，在 http 層自己寫同樣的 otel_exporter 區塊。
# 本片段不開追蹤：哪個 server 要起 span，由該 server include server.conf。

otel_exporter {
    endpoint otel-collector:4317;
}
